<!DOCTYPE html>
<html lang="en" data-theme="{{ theme }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Forex News Aggregator</title>
<link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo.png') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <button type="button" class="theme-toggle theme-toggle-float" aria-label="Toggle night mode">&#9789;</button>
  <div class="auth-shell">
    <form class="auth-card" method="POST">
      <div class="brand-mark">
        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="" width="44" height="44">
      </div>
      <h1>Forex News Aggregator</h1>
      <p class="subtitle">Sign in to continue</p>
      {% if error %}<div class="error">{{ error }}</div>{% endif %}
      <div class="field">
        <label>Username</label>
        <input type="text" name="username" required autofocus>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" name="password" required>
      </div>
      <button type="submit" class="btn">Login</button>
    </form>
  </div>
  <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Forex News Aggregator</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23f2f2f3'/%3E%3Crect x='3' y='12' width='4' height='7' rx='1' fill='%230a0a0b'/%3E%3Crect x='10' y='8' width='4' height='11' rx='1' fill='%230a0a0b'/%3E%3Crect x='17' y='4' width='4' height='15' rx='1' fill='%230a0a0b'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="auth-shell">
    <form class="auth-card" method="POST">
      <div class="brand-mark">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect x="3" y="12" width="4" height="7" rx="1" fill="currentColor"/>
          <rect x="10" y="8" width="4" height="11" rx="1" fill="currentColor"/>
          <rect x="17" y="4" width="4" height="15" rx="1" fill="currentColor"/>
        </svg>
      </div>
      <h1>Forex News Aggregator</h1>
      <p class="subtitle">Sign in to continue</p>
      {% if error %}<div class="error">{{ error }}</div>{% endif %}
      <div class="field">
        <label>Username</label>
        <input type="text" name="username" required autofocus>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" name="password" required>
      </div>
      <button type="submit" class="btn">Login</button>
    </form>
  </div>
</body>
</html>

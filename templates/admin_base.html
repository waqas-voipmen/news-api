<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Admin{% endblock %} - Forex News Aggregator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
{% block extra_style %}{% endblock %}
</head>
<body>

<div class="admin-shell">
  <div class="sidebar">
    <div class="brand">
      <div class="brand-mark">FX</div>
      <div class="brand-text">
        <h1>Admin Panel</h1>
        <p>Forex News Aggregator</p>
      </div>
    </div>
    <a href="{{ url_for('admin_users') }}" class="{{ 'active' if active == 'users' else '' }}">User Management</a>
    <a href="{{ url_for('admin_settings') }}" class="{{ 'active' if active == 'settings' else '' }}">Feature Controls</a>
    <div class="spacer"></div>
    <div class="divider"></div>
    <a href="{{ url_for('home') }}">&larr; Back to Dashboard</a>
    <a href="{{ url_for('logout') }}">Logout</a>
  </div>

  <div class="main">
    <h1>{% block heading %}{% endblock %}</h1>
    {% if message %}<div class="message">{{ message }}</div>{% endif %}
    {% block content %}{% endblock %}
  </div>
</div>

</body>
</html>

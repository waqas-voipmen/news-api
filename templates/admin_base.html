<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Admin{% endblock %} - Forex News Aggregator</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #161a21;
    --border: #262b35;
    --text: #e6e8eb;
    --muted: #8b93a1;
    --accent: #3b82f6;
    --bear: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    display: flex;
    min-height: 100vh;
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .sidebar {
    width: 220px;
    flex-shrink: 0;
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 20px 0;
    display: flex;
    flex-direction: column;
  }
  .sidebar h2 { font-size: 15px; margin: 0 0 20px; padding: 0 20px; }
  .sidebar a {
    display: block;
    padding: 10px 20px;
    color: var(--muted);
    text-decoration: none;
    font-size: 13px;
  }
  .sidebar a:hover { color: var(--text); }
  .sidebar a.active {
    color: var(--text);
    background: rgba(59,130,246,0.1);
    border-right: 2px solid var(--accent);
  }
  .sidebar .spacer { flex: 1; }
  .sidebar .divider { border-top: 1px solid var(--border); margin: 12px 0; }
  .main { flex: 1; min-width: 0; padding: 28px 32px; max-width: 760px; }
  .main h1 { font-size: 18px; margin: 0 0 20px; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 20px;
    overflow-x: auto;
  }
  .panel h3 {
    margin: 0 0 14px;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: .05em;
    color: var(--muted);
  }
  .field { margin-bottom: 12px; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  input[type=text], input[type=password] {
    width: 100%;
    background: #0f1115;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 13px;
  }
  button {
    padding: 9px 16px;
    background: var(--accent);
    border: none;
    color: white;
    font-weight: 600;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  button:hover { background: #2563eb; }
  button.danger { background: var(--bear); padding: 6px 10px; font-size: 12px; }
  button.danger:hover { background: #dc2626; }
  .message {
    background: rgba(59,130,246,0.1);
    border: 1px solid var(--accent);
    color: var(--text);
    padding: 10px 14px;
    border-radius: 6px;
    font-size: 13px;
    margin-bottom: 16px;
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 360px; }
  th {
    text-align: left;
    color: var(--muted);
    font-weight: 500;
    text-transform: uppercase;
    font-size: 11px;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
  }
  td { padding: 10px; border-bottom: 1px solid var(--border); }
  .badge {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 12px;
    background: var(--accent);
    color: white;
  }
  .toggle-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .toggle-row:last-child { border-bottom: none; }
  .toggle-row input { accent-color: var(--accent); width: 16px; height: 16px; }

  @media (max-width: 640px) {
    body { flex-direction: column; }
    .sidebar { width: 100%; flex-direction: row; overflow-x: auto; padding: 12px; }
    .sidebar h2 { display: none; }
    .sidebar a { white-space: nowrap; padding: 8px 12px; }
    .sidebar .spacer { display: none; }
    .sidebar .divider { display: none; }
    .main { padding: 20px 16px; }
  }
</style>
{% block extra_style %}{% endblock %}
</head>
<body>

<div class="sidebar">
  <h2>Admin Panel</h2>
  <a href="{{ url_for('admin_users') }}" class="{{ 'active' if active == 'users' else '' }}">User Management</a>
  <a href="{{ url_for('admin_settings') }}" class="{{ 'active' if active == 'settings' else '' }}">Feature Controls</a>
  <div class="spacer"></div>
  <div class="divider"></div>
  <a href="{{ url_for('home') }}">&larr; Back to Dashboard</a>
  <a href="{{ url_for('logout') }}">Logout</a>
</div>

<div class="main">
  <h1>{% block heading %}{% endblock %}</h1>
  {% if message %}<div class="message">{{ message }}</div>{% endif %}
  {% block content %}{% endblock %}
</div>

</body>
</html>
